<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- HTML: Table Tag (Block) -->
    <!-- ตารางแบบทุกแถวมีจำนวนคอลลัมน์เท่ากัน -->
    <table border="1" width="400">
      <tr>
        <td>A</td>
        <td>B</td>
        <td>C</td>
        <td>D</td>
      </tr>
      <tr>
        <td>E</td>
        <td>F</td>
        <td>G</td>
        <td>H</td>
      </tr>
      <tr>
        <td>I</td>
        <td>J</td>
        <td>K</td>
        <td>L</td>
      </tr>
      <tr>
        <td>M</td>
        <td>N</td>
        <td>O</td>
        <td>P</td>
      </tr>
    </table>
    <br />
    <br />

    <!--  ตารางแบบทุกแถวมีจำนวนคอลลัมน์เท่ากันบ้าง ไม่เท่ากันบ้าง -->
    <table border="1" width="400">
      <tr>
        <td colspan="2">A</td>
        <td>B</td>
        <td>C</td>
      </tr>
      <tr>
        <td rowspan="2">D</td>
        <td>E</td>
        <td colspan="2">F</td>
      </tr>
      <tr>
        <td colspan="2">G</td>
        <td rowspan="2">H</td>
      </tr>
        <tr>
            <td>I</td>
            <td>J</td>
            <td>K</td>
        </tr>
    </table>
  </body>
</html>
