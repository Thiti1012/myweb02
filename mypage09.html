<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- HTML: Form Tag (block) / รายละเอียด-องค์ประกอบ(inline) -->
     <form action="" method+"">
        <!-- ตระกูลป้อนข้อมูลต่างๆ -->
         <label for="">ป้อนอะไรก็ได้ *:</label>
         <input type="text" name="" id="" placeholder="ชื่อ-สกุล" required/> 
         <br><br>
         <label for="">ป้อนตัวเลข *:</label>
         <input type="number" name="" id="" placeholder="อายุ" required/> 
         <br><br>
         <label for="">ป้อนรหัสผ่าน *:</label>
         <input type="password" name="" id="" placeholder="รหัสผ่านไม่ต่ำกว่า 6 ตัว"/> 
         <br><br>
         <label for="">ป้อนอีเมล :</label>
         <input type="email" name="" id="" placeholder="อีเมล" /> 
         <br><br>
         <label for="">ป้อนอะไรก็ได้ที่มีเนื้อหาเยอะๆ :</label>
         <textarea name="" id="" cols="30" rows="5" placeholder="ใส่ข้อความ"></textarea>

         <!-- ตระกูลเลือกต่างๆ -->
        <!-- เลือกได้แค่ 1 และต้องเลือก -->
         <label for="">เลือกเพศ *:</label>
            <input type="radio" name="gender" id="" > ชาย
            <input type="radio" name="gender" id="" > หญิง
            <input type="radio" name="gender" id="" > LGBTQ
            <input type="radio" name="gender" id="" > ไม่ระบุ
         <br><br>
        <!-- เลือกได้หลายตัวเลือก -->
        <label for="">จังหวัดบ้านเกิด *:</label>
        <select name="" id="" > <!-- หรือเรียกว่า dropdown, select, combobox -->
            <option value="">-- เลือกจังหวัด --</option>
            <option value="bangkok">กรุงเทพฯ</option>
            <option value="samutprakan">สมุทรปราการ</option>
            <option value="nonthaburi">นนทบุรี</option>
        </select>
        <br><br>
        <label for ="">Major</label>>
        <select name="" id="" size="4"> <!-- หรือเรียกว่า List box -->
            <option value="">-- เลือกสาขา --</option>
            <option value="">การตลาด</option>
            <option value="">บัญชี</option>
            <option value="">คอมพิวเตอร์</option>
        </select>"
        <br><br>
        <!-- เลือกได้มากกว่า 1 หรือไม่เลือกก็ได้ -->
         <label for="">อาหารที่ชอบ :</label>
            <input type="checkbox" name="" id="" > KFC
            <input type="checkbox" name="" id="" > Pizza
            <input type="checkbox" name="" id="" > Oishi
            <input type="checkbox" name="" id="" > MK
        <br><br>
        <!-- เลือกไฟล์ -->
        <!-- เลือกไฟล์แบบไม่กรอง (no filter) -->
         <label for ="">เลือกไฟล์อะไรก็ได้ :</label>
         <input type="file" name="" id="" />
         <br><br>
        <!-- เลือกไฟล์แบบกรอง (filter) -->
         <label for ="">เลือกไฟล์รูปภาพ :</label>
         <input type="file" name="" id="" accept="image/*"/>
         <br><br>
         <label for ="">เลือกไฟล์ Word,Excel,PDF :</label>
         <input type="file" name="" id="" accept=".doc,.docx,.xls,.xlsx,.pdf"/>
         <br><br>
         <!-- เลือก วัน เวลา -->
         <label for ="">วันเกิด :</label>
         <input type="date" name="" id="" />
         <br><br>
        <label for ="">เวลา :</label>
        <input type="time" name="" id="" />
        <br><br>
        <label for ="">วันและเวลา :</label>
        <input type="datetime-local" name="" id="" />
        <br><br>

        <!-- ตระกูลปุ่ม -->
      <br><br>
      <input type="submit" value="ตกลง/บันทึก/ลบ/แก้ไข/ใช่">
      <br><br>
      <input type="reset" value="ยกเลิก/ล้างข้อมูล/รีเซ็ต">
      <br><br>
      <button>ตกลง/บันทึก/ลบ/แก้ไข/ใช่/ยกเลิก/ล้างข้อมูล/รีเซ็ต</button>
     </form>
</body>
</html>
